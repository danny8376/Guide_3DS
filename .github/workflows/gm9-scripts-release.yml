name: Release gm9 scripts

on:
  push:
    branches: [ master, gm9-scripts-release ]
    paths: [ '/docs/public/gm9_scripts/*' ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: rickstaa/action-create-tag@v1
        with:
          tag: gm9-scripts
          force_push_tag: true

      - uses: actions/upload-artifact@v4
        with:
          name: gm9-scripts
          path: /docs/public/gm9_scripts/

      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: gm9-scripts
          prerelease: true
          artifacts: gm9-scripts.zip
